services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - REDIS_URL=redis://redis:6379
      - SKIP_QUEUE_WORKER=true
    depends_on:
      - redis
    restart: always

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: always
