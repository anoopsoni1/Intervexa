name: Keep Render Backend Awake

on:
  schedule:
    # Run every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Backend
        run: |
          curl -fsS https://intervexabackend-1.onrender.com/health || exit 1
